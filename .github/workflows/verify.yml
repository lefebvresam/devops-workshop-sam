name: Verify Python API

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify-python-api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Check Python syntax
        run: python -m compileall -q app

      - name: Run tests
        run: python -m pytest -q tests
  deploy-preview:
    name: deployment-handoff
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: workshop-preview
    steps:
      - name: Record the verified candidate
        run: |
          printf 'Verified commit ready for deployment: %s\n' "$GITHUB_SHA"
          printf '%s\n' 'A real target is deliberately introduced in Lab 8.'

